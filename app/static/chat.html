<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
        .header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:16px 24px;display:flex;align-items:center;gap:12px}
        .header h1{font-size:20px;font-weight:600}
        .header .badge{background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:12px;font-size:12px}
        .header .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px}
        .header .dot{width:8px;height:8px;border-radius:50%;background:#4ade80}
        .chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
        .message{max-width:75%;padding:12px 16px;border-radius:16px;line-height:1.5;font-size:14px;white-space:pre-wrap}
        .message.user{align-self:flex-end;background:#667eea;color:white;border-bottom-right-radius:4px}
        .message.bot{align-self:flex-start;background:white;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
        .message .meta{font-size:11px;color:#999;margin-top:4px}
        .message.user .meta{color:rgba(255,255,255,0.7)}
        .input-container{padding:16px 20px;background:white;border-top:1px solid #e0e0e0;display:flex;gap:10px}
        .input-container input{flex:1;padding:12px 16px;border:1px solid #ddd;border-radius:24px;font-size:14px;outline:none}
        .input-container input:focus{border-color:#667eea}
        .input-container button{padding:12px 24px;background:#667eea;color:white;border:none;border-radius:24px;cursor:pointer;font-size:14px;font-weight:500}
        .input-container button:hover{background:#5a6fd6}
        .input-container button:disabled{background:#ccc;cursor:not-allowed}
        .typing{align-self:flex-start;color:#999;font-size:13px;padding:8px 16px;display:flex;align-items:center;gap:8px}
        .typing .dots span{display:inline-block;width:6px;height:6px;background:#999;border-radius:50%;animation:bounce 1.4s infinite}
        .typing .dots span:nth-child(2){animation-delay:0.2s}
        .typing .dots span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
        .quick-actions{padding:8px 20px;display:flex;gap:8px;flex-wrap:wrap}
        .quick-actions button{padding:6px 14px;background:white;border:1px solid #ddd;border-radius:16px;font-size:12px;cursor:pointer;color:#667eea}
        .quick-actions button:hover{background:#f0f0ff}
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Customer Support</h1>
        <span class="badge">Multi-Agent System</span>
        <div class="status"><div class="dot"></div><span id="connStatus">Connected</span></div>
    </div>
    <div class="chat-container" id="chat">
        <div class="message bot">Xin chao! Toi la AI Customer Support. Toi co the giup ban:
- Kiem tra trang thai don hang
- Ho tro doi/tra hang
- Xu ly van de thanh toan
- Ho tro ky thuat
- Tim kiem san pham

Ban can giup gi?</div>
    </div>
    <div class="quick-actions">
        <button onclick="send('Don hang ORD-12345 cua toi den dau roi?')">Tra cuu don hang</button>
        <button onclick="send('Toi muon tra lai ao jacket ORD-12345')">Doi/tra hang</button>
        <button onclick="send('Toi bi tru tien 2 lan')">Van de thanh toan</button>
        <button onclick="send('May loc nuoc bi loi, den do nhap nay')">Ho tro ky thuat</button>
        <button onclick="send('Tim ao jacket nam')">Tim san pham</button>
    </div>
    <div class="input-container">
        <input type="text" id="input" placeholder="Nhap tin nhan..." onkeypress="if(event.key==='Enter')sendMsg()">
        <button id="sendBtn" onclick="sendMsg()">Gui</button>
    </div>
    <script>
        const customerId = 'cust_001';
        const clientId = 'client_' + Math.random().toString(36).substr(2, 9);
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const connStatus = document.getElementById('connStatus');
        let ws = null;
        let useWebSocket = true;

        function connectWS() {
            try {
                ws = new WebSocket('ws://' + location.host + '/ws/chat/' + clientId);
                ws.onopen = () => { connStatus.textContent = 'Connected (WS)'; };
                ws.onclose = () => { connStatus.textContent = 'Disconnected'; useWebSocket = false; setTimeout(connectWS, 3000); };
                ws.onerror = () => { useWebSocket = false; };
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'typing') { addTyping(); }
                    else if (data.type === 'response') {
                        removeTyping();
                        const meta = 'Intent: ' + data.intent + ' | Confidence: ' + (data.confidence * 100).toFixed(0) + '% | Agents: ' + data.actions_taken.length;
                        addMessage(data.answer, 'bot', meta);
                    }
                };
            } catch(e) { useWebSocket = false; }
        }
        connectWS();

        function addMessage(text, type, meta) {
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = text;
            if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; div.appendChild(m); }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            if (document.getElementById('typing')) return;
            const div = document.createElement('div');
            div.className = 'typing'; div.id = 'typing';
            div.innerHTML = 'Dang xu ly <div class="dots"><span></span><span></span><span></span></div>';
            chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

        async function send(msg) { input.value = msg; sendMsg(); }

        async function sendMsg() {
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            addMessage(msg, 'user');

            if (useWebSocket && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({message: msg, customer_id: customerId}));
            } else {
                addTyping(); sendBtn.disabled = true;
                try {
                    const res = await fetch('/api/v1/chat', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({customer_id: customerId, message: msg})
                    });
                    const data = await res.json();
                    removeTyping();
                    const meta = 'Intent: ' + data.intent + ' | Confidence: ' + (data.confidence * 100).toFixed(0) + '%';
                    addMessage(data.answer, 'bot', meta);
                } catch(e) { removeTyping(); addMessage('Loi: ' + e.message, 'bot'); }
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
