[project]
name = "simple-rag-service"
version = "0.1.0"
description = "Customer Support RAG Service with LangGraph + ChromaDB + Redis"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Pydantic
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # LangChain ecosystem (aligned versions)
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.1.4",
    "langgraph>=0.2.50",
    # Vector store & Embeddings
    "chromadb>=0.5.20",
    "sentence-transformers>=3.2.0",
    # Document parsing
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    # Memory / Storage
    "redis>=5.2.0",
    # Web Search
    "tavily-python>=0.3.0",
    "duckduckgo-search>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
# This is an application, not a library - don't try to install it as a package
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
